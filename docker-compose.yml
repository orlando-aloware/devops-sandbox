services:
  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data

  grafana-agent:
    image: grafana/agent:latest
    volumes:
      - ./agent-config.yaml:/etc/agent/agent.yaml
      - ./storage/logs:/var/log/laravel
    command:
      - -config.file=/etc/agent/agent.yaml
    environment:
      - HOSTNAME=grafana-agent
    extra_hosts:
      - "host.docker.internal:host-gateway"
    network_mode: "host"

volumes:
  redis-data:
