name: K8s Long Run CI

on:
  workflow_dispatch:
    inputs:
      test_spec:
        description: 'Cypress test spec to run (leave empty for all tests)'
        required: false
        default: ''
  push:
    branches:
      - optimize-zap-pipeline
    paths:
      - '.github/workflows/k8s-long-run.yml'

jobs:
  run-in-eks:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    environment: dev
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install prerequisites (gh, kubectl)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y git curl jq
          # Install gh CLI
          if ! command -v gh >/dev/null 2>&1; then
            curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg | sudo dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
            sudo chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
            echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" | sudo tee /etc/apt/sources.list.d/github-cli.list > /dev/null
            sudo apt update
            sudo apt install -y gh
          fi
          # Install kubectl
          if ! command -v kubectl >/dev/null 2>&1; then
            curl -LO "https://dl.k8s.io/release/$(curl -L -s https://dl.k8s.io/release/stable.txt)/bin/linux/amd64/kubectl"
            sudo install -o root -g root -m 0755 kubectl /usr/local/bin/kubectl
          fi

      - name: Push code to devop-sandbox repo
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          set -euo pipefail
          REPO=aloware/devop-sandbox
          gh auth status
          
          # Add devop-sandbox remote if it doesn't exist
          if ! git remote | grep -q devop-sandbox; then
            git remote add devop-sandbox "https://github.com/$REPO.git"
          fi
          
          # Push to devop-sandbox repo
          git push devop-sandbox HEAD:main --force || echo "Push completed with status $?"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v2
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Update kubeconfig for EKS
        run: |
          set -euo pipefail
          aws eks update-kubeconfig --name "${{ vars.EKS_CLUSTER_NAME }}" --region "${{ vars.AWS_REGION }}"

      - name: Run tests inside Kubernetes Job
        id: run_job
        run: |
          set -euo pipefail

          JOB_NAME="long-run-test-job-${{ github.run_id }}"
          
          cat > /tmp/long-run-job.yaml <<'JOBEOF'
          apiVersion: batch/v1
          kind: Job
          metadata:
            name: JOBNAME_PLACEHOLDER
            labels:
              app: devops-sandbox-test
              environment: dev
          spec:
            backoffLimit: 0
            template:
              metadata:
                labels:
                  app: devops-sandbox-test
                  environment: dev
              spec:
                restartPolicy: Never
                containers:
                - name: test-runner
                  image: cypress/included:12.0.0
                  imagePullPolicy: IfNotPresent
                  env:
                    - name: GH_TOKEN
                      value: "GITHUB_TOKEN_PLACEHOLDER"
                  command: ["/bin/sh", "-c"]
                  args:
                    - |
                      set -e
                      echo "Cloning repo..."
                      git clone https://oauth2:${GH_TOKEN}@github.com/aloware/devop-sandbox.git /workspace
                      cd /workspace || exit 1
                      echo "Installing dependencies..."
                      npm ci --omit=dev || true
                      echo "Starting app in background..."
                      npm start &
                      sleep 5
                      echo "Running Cypress tests (long run)..."
                      npm run cypress:run || exit_code=$?
                      echo "Tests exited with ${exit_code:-0}"
                      exit ${exit_code:-0}
          JOBEOF
          
          sed -i "s/JOBNAME_PLACEHOLDER/$JOB_NAME/g" /tmp/long-run-job.yaml
          sed -i "s|GITHUB_TOKEN_PLACEHOLDER|${{ secrets.GH_TOKEN }}|g" /tmp/long-run-job.yaml
          
          kubectl apply -f /tmp/long-run-job.yaml
          echo "======================================"
          echo "Created Kubernetes Job: $JOB_NAME"
          echo "Environment: dev"
          echo "======================================"
          
          echo "Waiting for Job completion (timeout 4h)..."
          kubectl wait --for=condition=complete --timeout=4h job/$JOB_NAME

          # Get pod name
          POD=$(kubectl get pods -l job-name=$JOB_NAME -o jsonpath='{.items[0].metadata.name}')
          echo "======================================"
          echo "Job pod name: $POD"
          echo "======================================"
          echo "--- pod logs ---"
          kubectl logs "$POD" -c test-runner || true

          EXIT_CODE=$(kubectl get pod "$POD" -o jsonpath='{.status.containerStatuses[0].state.terminated.exitCode}') || EXIT_CODE=1
          echo "Pod exit code: $EXIT_CODE"
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

      - name: Fail if pod failed
        if: steps.run_job.outputs.exit_code != '0'
        run: |
          echo "Job failed (non-zero exit code)"
          exit 1
