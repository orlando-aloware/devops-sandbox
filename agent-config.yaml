server:
  log_level: info

metrics:
  wal_directory: /tmp/agent/wal
  global:
    scrape_interval: 15s
  configs:
    - name: laravel_metrics
      scrape_configs:
        - job_name: laravel
          static_configs:
            - targets: ['host.docker.internal:8000']
      remote_write:
        - url: YOUR_PROMETHEUS_URL
          basic_auth:
            username: YOUR_PROMETHEUS_USER
            password: YOUR_PROMETHEUS_PASSWORD

logs:
  configs:
    - name: laravel_logs
      positions:
        filename: /tmp/positions.yaml
      scrape_configs:
        - job_name: laravel_logs
          static_configs:
            - targets: [localhost]
              labels:
                job: laravel
                __path__: /var/log/laravel/*.log
          pipeline_stages:
            - json:
                expressions:
                  level: level_name
                  message: message
                  context: context
            - labels:
                level:
      clients:
        - url: YOUR_LOKI_URL
          basic_auth:
            username: YOUR_LOKI_USER
            password: YOUR_LOKI_PASSWORD
